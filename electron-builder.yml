appId: com.vishwam.grokdesktop
productName: Grok Desktop
copyright: Copyright © 2026 Grok Desktop contributors
directories:
  buildResources: resources
  output: release
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources/icon.png
    to: icon.png
asar: true
asarUnpack:
  - '**/*.node'
extraMetadata:
  main: out/main/index.js
mac:
  category: public.app-category.developer-tools
  icon: resources/icon.icns
  artifactName: ${productName}-${version}-${arch}.${ext}
  target:
    - target: dir
      arch:
        - arm64
    - target: dmg
      arch:
        - arm64
  hardenedRuntime: true
  gatekeeperAssess: false
  identity: null
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  extendInfo:
    CFBundleName: Grok Desktop
    CFBundleDisplayName: Grok Desktop
    CFBundleSpokenName: Grok Desktop
    NSHighResolutionCapable: true
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
win:
  icon: resources/icon.png
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-Setup-${version}.${ext}
linux:
  icon: resources/icon.png
  category: Development
  target:
    - AppImage
    - deb
  artifactName: ${name}-${version}-${arch}.${ext}
publish: null
npmRebuild: false
electronVersion: 37.4.0
